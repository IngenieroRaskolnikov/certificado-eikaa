<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado E'ikaa</title>
  <style>
    body { margin: 0; padding: 15px; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f5f5f5; }
    .cert-container { background: #fdfaf6; max-width: 800px; margin: 0 auto; padding: 25px 15px; border: 8px solid #b83227; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .inner-border { border: 2px dashed #008080; padding: 20px 10px; border-radius: 8px; }
    .logo { width: 130px; height: auto; margin-bottom: 5px; }
    h1 { color: #b83227; font-size: 24px; margin: 10px 0 5px 0; text-transform: uppercase; }
    .slogan { color: #008080; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; margin-bottom: 20px; text-transform: uppercase; }
    .body-text { color: #333; font-size: 16px; line-height: 1.5; margin: 15px 0; }
    .student-name { color: #b83227; font-size: 24px; font-weight: bold; text-decoration: underline; display: inline-block; margin: 5px 0; }
    .level-tag { background-color: #b83227; color: white; padding: 3px 10px; border-radius: 4px; font-weight: bold; }
    .native-quote { color: #666; font-style: italic; font-size: 14px; margin-top: 15px; }
    .footer-date { margin-top: 25px; font-size: 13px; color: #555; }
    .btn-print { margin-top: 15px; background-color: #b83227; color: white; border: none; padding: 10px 22px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    @media print { .btn-print { display: none; } body { padding: 0; background: white; } .cert-container { box-shadow: none; } }
  </style>
</head>
<body>

  <div class="cert-container">
    <div class="inner-border">
      <img src="logo_eikaa.png" class="logo" alt="Logo E'ikaa">
      <div class="slogan">Nuestra Lengua, Nuestra Identidad</div>
      <h1>Certificado de Logro</h1>

      <div class="body-text">
        La aplicación <strong>E’ikaa</strong> certifica a<br>
        <span id="nombreAlumno" class="student-name">Cargando...</span><br>
        como <span class="level-tag">Nivel Principiante</span> en Wayuunaiki.
      </div>

      <div class="native-quote">¡Anasü ma'i pükua'ipa! — ¡Muy buen trabajo!</div>
      <div class="footer-date">Expedido el: <strong id="fechaHoy"></strong></div>
    </div>
  </div>

  <button class="btn-print" onclick="window.print()">Imprimir / Guardar como PDF</button>

  <script>
    window.onload = function() {
      // Extrae el nombre enviado desde App Inventor después del signo #
      let nombre = decodeURIComponent(window.location.hash.substring(1));
      
      if (!nombre || nombre.trim() === "" || nombre === "undefined") {
        nombre = "Estudiante";
      }

      document.getElementById("nombreAlumno").innerText = nombre;

      const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById("fechaHoy").innerText = new Date().toLocaleDateString('es-CO', opciones);
    };
  </script>
</body>
</html>
